[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-product-agent"
version = "0.1.0"
description = "A human-approved MCP product-building agent for local workspaces."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "mcp==2.0.0",
]

[project.scripts]
forge-agent = "forge_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
