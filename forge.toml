[agent]
provider = "groq"
model = "openai/gpt-oss-120b"
fallback_providers = ["local"]
workspace = "product_workspace"
max_output_tokens = 4096
max_tool_rounds = 8
request_timeout_seconds = 120
tool_output_limit = 30000

[providers.groq]
base_url = "https://api.groq.com/openai/v1"
api_key_env = "GROQ_API_KEY"

[providers.local]
base_url = "http://127.0.0.1:1234/v1"
api_key_env = ""
model = "forge-local"

[workspace]
max_file_bytes = 1000000
command_timeout_seconds = 90
allowed_commands = ["python", "py", "git"]
allow_project_code_execution = false

[research]
enabled = true
request_timeout_seconds = 20
max_response_bytes = 500000
max_redirects = 3
allowed_domains = []
search_provider = "perplexity"
search_api_key_env = "PERPLEXITY_API_KEY"
